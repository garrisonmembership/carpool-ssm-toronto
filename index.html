<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carpool Driver — SSM to Toronto</title>

<!-- Firebase (compat SDK — simplest for a single-file app) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --asphalt:#1C2128;
    --paper:#F7F4EC;
    --highway-green:#1B4332;
    --highway-green-light:#2D6A4F;
    --amber:#E8A33D;
    --ink:#2B2B2B;
    --line:#D9D2C0;
    --danger:#B3261E;
    --danger-bg:#FBEAE9;
    --success-bg:#E7F3EC;
    --success:#1B4332;
    --warn-bg:#FDF3E4;
    --warn:#8A5A15;
    --muted:#8A8478;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Inter",sans-serif;
    background:var(--paper); color:var(--ink);
  }
  .mono{ font-family:"JetBrains Mono","SFMono-Regular",Menlo,monospace; }
  header{
    background:var(--asphalt); color:white; padding:16px 20px;
    display:flex; justify-content:space-between; align-items:center;
  }
  header h1{ font-size:16px; margin:0; font-weight:600; letter-spacing:0.3px; }
  header .sub{ font-size:12px; color:#9aa5b1; }
  main{ max-width:720px; margin:0 auto; padding:16px; padding-bottom:80px; }
  .hidden{ display:none !important; }

  /* Login */
  #login-screen{
    max-width:340px; margin:80px auto; text-align:center; padding:24px;
  }
  #login-screen input{
    width:100%; padding:12px; font-size:16px; border:1px solid var(--line);
    border-radius:8px; margin:12px 0; text-align:center;
  }
  #login-screen button{ width:100%; }
  #login-error{ color:var(--danger); font-size:13px; min-height:18px; }

  button{
    font-size:14px; padding:10px 14px; border-radius:8px; border:1px solid var(--line);
    background:white; color:var(--ink); cursor:pointer;
  }
  button.primary{ background:var(--highway-green); color:white; border:none; }
  button.danger{ border-color:var(--danger); color:var(--danger); background:white; }
  button.ghost{ background:transparent; border-style:dashed; }
  button:disabled{ opacity:0.5; cursor:not-allowed; }

  .card{ background:white; border-radius:12px; padding:14px 16px; margin-bottom:10px; border:1px solid var(--line); }
  .stat-row{ display:flex; gap:10px; margin:14px 0; }
  .stat{ flex:1; background:white; border-radius:10px; padding:10px 12px; border:1px solid var(--line); }
  .stat .label{ font-size:11px; color:var(--muted); }
  .stat .value{ font-size:18px; font-weight:600; margin-top:2px; }

  .trip-list-item{
    display:flex; justify-content:space-between; align-items:center;
    background:white; border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:8px; cursor:pointer;
  }
  .trip-list-item:hover{ border-color:var(--highway-green); }

  .badge{ font-size:11px; padding:2px 8px; border-radius:6px; display:inline-block; margin-top:4px; }
  .badge.paid{ background:var(--success-bg); color:var(--success); }
  .badge.unpaid{ background:var(--warn-bg); color:var(--warn); }

  .warn-banner{
    background:var(--danger-bg); color:var(--danger); font-size:12px;
    padding:6px 10px; border-radius:6px; margin-top:6px;
  }

  /* Route spine (trip sheet view) */
  .spine-row{ display:grid; grid-template-columns:28px 1fr; column-gap:12px; }
  .spine-dot{ width:14px; height:14px; border-radius:50%; background:var(--asphalt); margin-top:4px; }
  .spine-dot.hollow{ background:white; border:2px solid var(--asphalt); }
  .spine-line{ flex:1; width:0; border-left:2px dashed var(--line); min-height:36px; margin-left:6px; }
  .stop-block{ padding-bottom:16px; }
  .stop-header{ display:flex; justify-content:space-between; align-items:baseline; }
  .passenger-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--paper); border-radius:8px; padding:8px 10px; margin-top:6px;
  }
  .passenger-row .actions{ display:flex; gap:6px; }
  .passenger-row .actions button{ padding:6px 8px; font-size:13px; }

  .fieldset{ display:flex; flex-direction:column; gap:12px; }
  .fieldset label{ font-size:13px; color:#5b5648; display:block; margin-bottom:4px; }
  .fieldset input, .fieldset select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px;
  }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(28,33,40,0.5); display:flex;
    align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal{
    background:var(--paper); width:100%; max-width:480px; border-radius:16px 16px 0 0;
    padding:20px; max-height:88vh; overflow-y:auto;
  }
  @media (min-width:600px){
    .modal-backdrop{ align-items:center; }
    .modal{ border-radius:16px; }
  }
  .modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .modal-header h2{ margin:0; font-size:17px; }

  .toggle-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-top:1px solid var(--line);
  }
  .toggle-row:last-of-type{ border-bottom:1px solid var(--line); }

  /* Driving mode */
  .next-stop-card{
    background:#EAF3EE; border-radius:12px; padding:16px 18px; margin-bottom:16px;
  }
  .next-stop-card .eyebrow{ font-size:11px; color:var(--highway-green); font-weight:600; }
  .next-stop-card .name{ font-size:22px; font-weight:600; margin:4px 0 2px; }
  .next-stop-card .meta{ font-size:13px; color:#5b5648; margin-bottom:12px; }
  .upcoming-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; background:white;
  }
  .upcoming-item.overbooked{ border-color:var(--danger); }

  .tabbar{
    position:fixed; bottom:0; left:0; right:0; background:white; border-top:1px solid var(--line);
    display:flex; justify-content:center; gap:8px; padding:10px;
  }
  .tabbar button{ flex:1; max-width:220px; }
  .tabbar button.active{ background:var(--asphalt); color:white; border:none; }

  .icon-btn{ text-decoration:none; }
  a.icon-btn button{ pointer-events:none; }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <h1 style="margin-bottom:4px;">Carpool Driver</h1>
  <div style="font-size:13px; color:#8A8478; margin-bottom:12px;">Sault Ste. Marie &rarr; Toronto</div>
  <input id="passcode-input" type="password" placeholder="Passcode" autocomplete="off" />
  <button class="primary" onclick="attemptLogin()">Unlock</button>
  <div id="login-error"></div>
</div>

<!-- ===================== APP SHELL ===================== -->
<div id="app-shell" class="hidden">
  <header>
    <div>
      <h1 id="header-title">Trips</h1>
      <div class="sub" id="header-sub">Sault Ste. Marie &rarr; Toronto</div>
    </div>
    <button onclick="logout()" style="background:transparent;border-color:#3a4250;color:white;">Log out</button>
  </header>

  <main>

    <!-- ---------- TRIP LIST VIEW ---------- -->
    <div id="view-trip-list">
      <button class="primary" style="width:100%; margin-bottom:14px;" onclick="openNewTripModal()">+ New trip</button>
      <div id="trip-list-container"></div>
    </div>

    <!-- ---------- TRIP SHEET VIEW ---------- -->
    <div id="view-trip-sheet" class="hidden">
      <button onclick="goToTripList()" style="margin-bottom:12px;">&larr; All trips</button>

      <div class="stat-row" id="trip-stats"></div>

      <div id="stops-container"></div>

      <div style="display:flex; gap:8px; margin-top:16px;">
        <button style="flex:1;" onclick="openAddStopModal()">+ Add stop</button>
        <button class="primary" style="flex:1;" onclick="goToDrivingMode()">Start driving mode</button>
      </div>
    </div>

    <!-- ---------- DRIVING MODE VIEW ---------- -->
    <div id="view-driving-mode" class="hidden">
      <button onclick="goToTripSheet()" style="margin-bottom:12px;">&larr; Trip sheet</button>
      <div id="driving-mode-container"></div>
    </div>

  </main>
</div>

<!-- ===================== MODALS ===================== -->
<div id="modal-root"></div>

<script>
/* =========================================================================
   FIREBASE SETUP
   -------------------------------------------------------------------------
   1. Go to https://console.firebase.google.com -> create a project (or
      reuse the one from your Chit Fund / Garrison Club apps).
   2. Enable "Firestore Database" (start in production mode).
   3. Project settings -> your web app -> copy the config object below.
   4. In Firestore Rules, use something like:

      rules_version = '2';
      service cloud.firestore {
        match /databases/{database}/documents {
          match /trips/{tripId} {
            allow read, write: if true; // fine for a private, unlisted URL.
          }
        }
      }

      This app has NO real authentication — the passcode below only hides
      the UI in the browser. Anyone with your Firestore config and the
      collection name could technically read/write it directly. Since this
      is a single-driver tool on an unlisted GitHub Pages URL, that's a
      reasonable tradeoff — but don't put anything sensitive (like full
      card numbers) in here.
   ========================================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyAbIi87LdhKb39MTesNqLsR_3lfwkXBRhA",
  authDomain: "carpool-e3ee7.firebaseapp.com",
  projectId: "carpool-e3ee7",
  storageBucket: "carpool-e3ee7.firebasestorage.app",
  messagingSenderId: "349175279574",
  appId: "1:349175279574:web:0109665192b747eaa63e77"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Simple client-side passcode gate — change this before deploying.
const ADMIN_PASSCODE = "Nirmalcarpool@2026";

// Common landmarks along the Sault Ste. Marie -> Toronto corridor.
// Used to quick-fill the "Add stop" form instead of retyping each trip.
const STOP_TEMPLATES = [
  { name: "Sault Ste. Marie", location: "Start of route", lat: 46.5153817, lng: -84.3330487, distanceKm: 0 },
  { name: "Espanola", location: "Common fuel/washroom stop", lat: 46.2647877, lng: -81.7701891, distanceKm: 260 },
  { name: "Sudbury", location: "Tim Hortons, 1486 LaSalle Blvd", lat: 46.522637, lng: -80.942712, distanceKm: 320 },
  { name: "French River Trading Post", location: "20112 Settlers Rd, Alban", lat: 46.0281576, lng: -80.5930934, distanceKm: 430 },
  { name: "Parry Sound", location: "Hwy 400", lat: 45.3436156, lng: -80.033885, distanceKm: 560 },
  { name: "Webers, Orillia", location: "8825 ON-11, Orillia", lat: 44.694001, lng: -79.3988953, distanceKm: 730 },
  { name: "Toronto", location: "End of route", lat: 43.6548046, lng: -79.3883031, distanceKm: 960 },
];

function mapsLinks(lat, lng){
  if (lat == null || lng == null) return null;
  return {
    google: `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`,
    apple: `https://maps.apple.com/?daddr=${lat},${lng}`
  };
}

/* =========================================================================
   STATE
   ========================================================================= */
let trips = [];               // all trips, live from Firestore
let currentTripId = null;     // trip currently open in trip-sheet / driving mode
let currentStopIndex = 0;     // which stop driving-mode is focused on
let unsubscribeTrips = null;

/* =========================================================================
   AUTH (client-side only, see note above)
   ========================================================================= */
function attemptLogin(){
  const val = document.getElementById('passcode-input').value;
  if (val === ADMIN_PASSCODE) {
    sessionStorage.setItem('carpool_unlocked', 'true');
    showApp();
  } else {
    document.getElementById('login-error').textContent = "Wrong passcode.";
  }
}
document.getElementById('passcode-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') attemptLogin();
});

function logout(){
  sessionStorage.removeItem('carpool_unlocked');
  if (unsubscribeTrips) unsubscribeTrips();
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}

function showApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
  listenToTrips();
}

if (sessionStorage.getItem('carpool_unlocked') === 'true') showApp();

/* =========================================================================
   FIRESTORE: live sync
   Data model: one doc per trip in "trips" collection.
   trip = {
     date, departureTime, carCapacity,
     stops: [
       { id, name, location, etaTime, distanceKm,
         passengers: [ { id, name, phone, seats, paid, pickedUp } ] }
     ]
   }
   ========================================================================= */
function listenToTrips(){
  unsubscribeTrips = db.collection('trips').orderBy('date', 'desc')
    .onSnapshot(snap => {
      trips = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderTripList();
      if (currentTripId) {
        renderTripSheet();
        renderDrivingMode();
      }
    }, err => {
      console.error(err);
      alert("Couldn't connect to Firestore. Check your firebaseConfig at the top of the file.");
    });
}

function getCurrentTrip(){
  return trips.find(t => t.id === currentTripId);
}

function saveTrip(trip){
  const { id, ...data } = trip;
  return db.collection('trips').doc(id).set(data);
}

/* =========================================================================
   NAVIGATION
   ========================================================================= */
function goToTripList(){
  currentTripId = null;
  document.getElementById('view-trip-list').classList.remove('hidden');
  document.getElementById('view-trip-sheet').classList.add('hidden');
  document.getElementById('view-driving-mode').classList.add('hidden');
  document.getElementById('header-title').textContent = "Trips";
}

function openTrip(tripId){
  currentTripId = tripId;
  currentStopIndex = 0;
  document.getElementById('view-trip-list').classList.add('hidden');
  document.getElementById('view-trip-sheet').classList.remove('hidden');
  document.getElementById('view-driving-mode').classList.add('hidden');
  renderTripSheet();
}

function goToTripSheet(){
  document.getElementById('view-driving-mode').classList.add('hidden');
  document.getElementById('view-trip-sheet').classList.remove('hidden');
  renderTripSheet();
}

function goToDrivingMode(){
  currentStopIndex = 0;
  document.getElementById('view-trip-sheet').classList.add('hidden');
  document.getElementById('view-driving-mode').classList.remove('hidden');
  renderDrivingMode();
}

/* =========================================================================
   RENDER: trip list
   ========================================================================= */
function renderTripList(){
  const container = document.getElementById('trip-list-container');
  if (trips.length === 0){
    container.innerHTML = `<div class="card" style="text-align:center; color:var(--muted);">No trips yet. Create one above.</div>`;
    return;
  }
  container.innerHTML = trips.map(t => {
    const stopCount = (t.stops || []).length;
    const paxCount = (t.stops || []).reduce((sum, s) => sum + (s.passengers || []).reduce((a,p)=>a+Number(p.seats||0),0), 0);
    return `
      <div class="trip-list-item" onclick="openTrip('${t.id}')">
        <div>
          <div style="font-weight:600;">${escapeHtml(t.date || 'Untitled trip')}</div>
          <div style="font-size:12px; color:var(--muted);">${stopCount} stops &middot; ${paxCount} seats booked</div>
        </div>
        <button class="danger" onclick="event.stopPropagation(); deleteTrip('${t.id}')">Delete</button>
      </div>`;
  }).join('');
}

function deleteTrip(tripId){
  if (!confirm("Delete this trip? This can't be undone.")) return;
  db.collection('trips').doc(tripId).delete();
}

function openNewTripModal(){
  renderModal(`
    <div class="modal-header"><h2>New trip</h2><button onclick="closeModal()">&times;</button></div>
    <div class="fieldset">
      <div>
        <label>Date</label>
        <input id="new-trip-date" type="date" />
      </div>
      <div>
        <label>Departure time</label>
        <input id="new-trip-departure" type="time" value="06:00" />
      </div>
      <div>
        <label>Car capacity (seats)</label>
        <input id="new-trip-capacity" type="number" value="4" min="1" max="8" />
      </div>
    </div>
    <div style="display:flex; gap:8px; margin-top:20px;">
      <button style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="primary" style="flex:1;" onclick="createTrip()">Create trip</button>
    </div>
  `);
}

function createTrip(){
  const date = document.getElementById('new-trip-date').value || new Date().toISOString().slice(0,10);
  const departureTime = document.getElementById('new-trip-departure').value;
  const carCapacity = Number(document.getElementById('new-trip-capacity').value) || 4;
  const newDoc = db.collection('trips').doc();
  newDoc.set({ date, departureTime, carCapacity, stops: [] }).then(() => {
    closeModal();
    openTrip(newDoc.id);
  });
}

/* =========================================================================
   RENDER: trip sheet (route spine + stops + passengers)
   ========================================================================= */
function renderTripSheet(){
  const trip = getCurrentTrip();
  if (!trip) return;

  document.getElementById('header-title').textContent = trip.date || "Trip";
  document.getElementById('header-sub').textContent = `Departs ${trip.departureTime || '—'} · Sault Ste. Marie → Toronto`;

  const stops = trip.stops || [];
  const totalPax = stops.reduce((sum, s) => sum + (s.passengers||[]).reduce((a,p)=>a+Number(p.seats||0),0), 0);

  document.getElementById('trip-stats').innerHTML = `
    <div class="stat"><div class="label">Stops</div><div class="value">${stops.length}</div></div>
    <div class="stat"><div class="label">Seats booked</div><div class="value">${totalPax} / ${trip.carCapacity}</div></div>
    <div class="stat"><div class="label">Departs</div><div class="value">${trip.departureTime || '—'}</div></div>
  `;

  const container = document.getElementById('stops-container');
  if (stops.length === 0){
    container.innerHTML = `<div class="card" style="text-align:center; color:var(--muted);">No stops yet. Add the first one below.</div>`;
    return;
  }

  container.innerHTML = stops.map((stop, idx) => {
    const seatsAtStop = (stop.passengers||[]).reduce((a,p)=>a+Number(p.seats||0),0);
    const overbooked = seatsAtStop > Number(trip.carCapacity || 4);
    const isLast = idx === stops.length - 1;

    const passengerRows = (stop.passengers||[]).map(p => `
      <div class="passenger-row">
        <div>
          <div style="font-size:13px; font-weight:500;">${escapeHtml(p.name)} <span style="color:var(--muted); font-weight:400;">· ${p.seats} seat${p.seats==1?'':'s'}</span></div>
          <span class="badge ${p.paid ? 'paid':'unpaid'}">${p.paid ? 'Paid':'Unpaid'}</span>
        </div>
        <div class="actions">
          <button onclick="openEditPassengerModal(${idx}, '${p.id}')">Edit</button>
        </div>
      </div>
    `).join('');

    return `
      <div class="spine-row">
        <div style="display:flex; flex-direction:column; align-items:center;">
          <div class="spine-dot ${idx>0 && !isLast ? 'hollow':''}"></div>
          ${!isLast ? '<div class="spine-line"></div>' : ''}
        </div>
        <div class="stop-block">
          <div class="stop-header">
            <div style="font-size:15px; font-weight:600;">${escapeHtml(stop.name)}</div>
            <div class="mono" style="font-size:12px; color:var(--muted);">${stop.distanceKm||0} km · ${stop.etaTime||''}</div>
          </div>
          <div style="font-size:13px; color:var(--muted); margin-bottom:4px;">${escapeHtml(stop.location||'')}</div>
          ${navButtonsHtml(stop.lat, stop.lng)}
          ${overbooked ? `<div class="warn-banner">⚠ ${seatsAtStop} of ${trip.carCapacity} seats booked at this point</div>` : ''}
          ${passengerRows}
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button class="ghost" style="flex:1;" onclick="openAddPassengerModal(${idx})">+ Add passenger</button>
            <button onclick="openEditStopModal(${idx})">Edit stop</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

/* ---------- Add / edit stop ---------- */
function openAddStopModal(){
  const templateOptions = STOP_TEMPLATES.map((t,i) => `<option value="${i}">${escapeHtml(t.name)}</option>`).join('');
  renderModal(`
    <div class="modal-header"><h2>Add stop</h2><button onclick="closeModal()">&times;</button></div>
    <div class="fieldset">
      <div>
        <label>Quick-fill from a usual stop</label>
        <select id="stop-template" onchange="applyStopTemplate(this.value)">
          <option value="">— Type your own below —</option>
          ${templateOptions}
        </select>
      </div>
      <div><label>Stop name</label><input id="stop-name" placeholder="e.g. Sudbury" /></div>
      <div><label>Location / landmark</label><input id="stop-location" placeholder="e.g. Petro-Canada, LaSalle Blvd" /></div>
      <div><label>Distance from start (km)</label><input id="stop-distance" type="number" /></div>
      <div><label>ETA</label><input id="stop-eta" type="time" /></div>
      <div style="display:flex; gap:8px;">
        <div style="flex:1;"><label>Latitude (optional)</label><input id="stop-lat" type="number" step="any" placeholder="e.g. 46.5226" /></div>
        <div style="flex:1;"><label>Longitude (optional)</label><input id="stop-lng" type="number" step="any" placeholder="e.g. -80.9427" /></div>
      </div>
      <div style="font-size:12px; color:var(--muted);">Lat/lng power the "Open in Google Maps" / "Open in Apple Maps" buttons on this stop. Quick-fill sets these for you automatically.</div>
    </div>
    <div style="display:flex; gap:8px; margin-top:20px;">
      <button style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="primary" style="flex:1;" onclick="saveNewStop()">Add stop</button>
    </div>
  `);
}

function applyStopTemplate(idx){
  if (idx === "") return;
  const t = STOP_TEMPLATES[Number(idx)];
  document.getElementById('stop-name').value = t.name;
  document.getElementById('stop-location').value = t.location;
  document.getElementById('stop-distance').value = t.distanceKm;
  document.getElementById('stop-lat').value = t.lat;
  document.getElementById('stop-lng').value = t.lng;
}

function saveNewStop(){
  const trip = getCurrentTrip();
  const lat = document.getElementById('stop-lat').value;
  const lng = document.getElementById('stop-lng').value;
  const stop = {
    id: 'stop_' + Date.now(),
    name: document.getElementById('stop-name').value || 'Untitled stop',
    location: document.getElementById('stop-location').value,
    distanceKm: Number(document.getElementById('stop-distance').value) || 0,
    etaTime: document.getElementById('stop-eta').value,
    lat: lat === "" ? null : Number(lat),
    lng: lng === "" ? null : Number(lng),
    passengers: []
  };
  const stops = [...(trip.stops||[]), stop].sort((a,b)=>(a.distanceKm||0)-(b.distanceKm||0));
  saveTrip({ ...trip, stops }).then(closeModal);
}

function openEditStopModal(idx){
  const trip = getCurrentTrip();
  const stop = trip.stops[idx];
  renderModal(`
    <div class="modal-header"><h2>Edit stop</h2><button class="danger" onclick="deleteStop(${idx})">Delete stop</button></div>
    <div class="fieldset">
      <div><label>Stop name</label><input id="stop-name" value="${escapeAttr(stop.name)}" /></div>
      <div><label>Location / landmark</label><input id="stop-location" value="${escapeAttr(stop.location||'')}" /></div>
      <div><label>Distance from start (km)</label><input id="stop-distance" type="number" value="${stop.distanceKm||0}" /></div>
      <div><label>ETA</label><input id="stop-eta" type="time" value="${stop.etaTime||''}" /></div>
      <div style="display:flex; gap:8px;">
        <div style="flex:1;"><label>Latitude (optional)</label><input id="stop-lat" type="number" step="any" value="${stop.lat ?? ''}" /></div>
        <div style="flex:1;"><label>Longitude (optional)</label><input id="stop-lng" type="number" step="any" value="${stop.lng ?? ''}" /></div>
      </div>
      <div style="font-size:12px; color:var(--muted);">Lat/lng power the "Open in Google Maps" / "Open in Apple Maps" buttons on this stop.</div>
    </div>
    <div style="display:flex; gap:8px; margin-top:20px;">
      <button style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="primary" style="flex:1;" onclick="saveEditedStop(${idx})">Save changes</button>
    </div>
  `);
}

function saveEditedStop(idx){
  const trip = getCurrentTrip();
  const stops = [...trip.stops];
  const lat = document.getElementById('stop-lat').value;
  const lng = document.getElementById('stop-lng').value;
  stops[idx] = {
    ...stops[idx],
    name: document.getElementById('stop-name').value,
    location: document.getElementById('stop-location').value,
    distanceKm: Number(document.getElementById('stop-distance').value) || 0,
    etaTime: document.getElementById('stop-eta').value,
    lat: lat === "" ? null : Number(lat),
    lng: lng === "" ? null : Number(lng),
  };
  stops.sort((a,b)=>(a.distanceKm||0)-(b.distanceKm||0));
  saveTrip({ ...trip, stops }).then(closeModal);
}

function deleteStop(idx){
  if (!confirm("Delete this stop and its passengers?")) return;
  const trip = getCurrentTrip();
  const stops = trip.stops.filter((_, i) => i !== idx);
  saveTrip({ ...trip, stops }).then(closeModal);
}

/* ---------- Add / edit passenger ---------- */
function openAddPassengerModal(stopIdx){
  const trip = getCurrentTrip();
  renderModal(`
    <div class="modal-header"><h2>Add passenger</h2><button onclick="closeModal()">&times;</button></div>
    <div class="fieldset">
      <div><label>Name</label><input id="pax-name" /></div>
      <div><label>Phone</label><input id="pax-phone" type="tel" placeholder="+1 705 555 0142" /></div>
      <div><label>Seats</label><input id="pax-seats" type="number" value="1" min="1" max="${trip.carCapacity}" /></div>
      <div class="toggle-row"><label for="pax-paid">Marked as paid</label><input id="pax-paid" type="checkbox" /></div>
    </div>
    <div id="overbook-warning"></div>
    <div style="display:flex; gap:8px; margin-top:20px;">
      <button style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="primary" style="flex:1;" onclick="saveNewPassenger(${stopIdx})">Add passenger</button>
    </div>
  `);
}

function saveNewPassenger(stopIdx){
  const trip = getCurrentTrip();
  const stops = [...trip.stops];
  const stop = { ...stops[stopIdx] };
  const passenger = {
    id: 'pax_' + Date.now(),
    name: document.getElementById('pax-name').value || 'Unnamed',
    phone: document.getElementById('pax-phone').value,
    seats: Number(document.getElementById('pax-seats').value) || 1,
    paid: document.getElementById('pax-paid').checked,
    pickedUp: false
  };
  stop.passengers = [...(stop.passengers||[]), passenger];
  stops[stopIdx] = stop;
  saveTrip({ ...trip, stops }).then(closeModal);
}

function openEditPassengerModal(stopIdx, paxId){
  const trip = getCurrentTrip();
  const stop = trip.stops[stopIdx];
  const p = stop.passengers.find(x => x.id === paxId);
  renderModal(`
    <div class="modal-header"><h2>Edit passenger</h2><button class="danger" onclick="deletePassenger(${stopIdx}, '${paxId}')">Delete</button></div>
    <div class="fieldset">
      <div><label>Name</label><input id="pax-name" value="${escapeAttr(p.name)}" /></div>
      <div><label>Phone</label><input id="pax-phone" type="tel" value="${escapeAttr(p.phone||'')}" /></div>
      <div><label>Pickup stop</label>
        <select id="pax-stop">
          ${trip.stops.map((s,i)=>`<option value="${i}" ${i===stopIdx?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
        </select>
      </div>
      <div><label>Seats</label><input id="pax-seats" type="number" value="${p.seats}" min="1" max="${trip.carCapacity}" /></div>
      <div class="toggle-row"><label for="pax-paid">Marked as paid</label><input id="pax-paid" type="checkbox" ${p.paid?'checked':''} /></div>
      <div class="toggle-row"><label for="pax-pickedup">Marked as picked up</label><input id="pax-pickedup" type="checkbox" ${p.pickedUp?'checked':''} /></div>
    </div>
    <div style="display:flex; gap:8px; margin-top:20px;">
      <button style="flex:1;" onclick="closeModal()">Cancel</button>
      <button class="primary" style="flex:1;" onclick="saveEditedPassenger(${stopIdx}, '${paxId}')">Save changes</button>
    </div>
  `);
}

function saveEditedPassenger(oldStopIdx, paxId){
  const trip = getCurrentTrip();
  const stops = trip.stops.map(s => ({ ...s, passengers: [...(s.passengers||[])] }));
  const oldStop = stops[oldStopIdx];
  const paxIdx = oldStop.passengers.findIndex(x => x.id === paxId);
  const updated = {
    ...oldStop.passengers[paxIdx],
    name: document.getElementById('pax-name').value,
    phone: document.getElementById('pax-phone').value,
    seats: Number(document.getElementById('pax-seats').value) || 1,
    paid: document.getElementById('pax-paid').checked,
    pickedUp: document.getElementById('pax-pickedup').checked,
  };
  const newStopIdx = Number(document.getElementById('pax-stop').value);

  oldStop.passengers.splice(paxIdx, 1);
  stops[newStopIdx].passengers.push(updated);

  saveTrip({ ...trip, stops }).then(closeModal);
}

function deletePassenger(stopIdx, paxId){
  if (!confirm("Remove this passenger?")) return;
  const trip = getCurrentTrip();
  const stops = [...trip.stops];
  stops[stopIdx] = { ...stops[stopIdx], passengers: stops[stopIdx].passengers.filter(p => p.id !== paxId) };
  saveTrip({ ...trip, stops }).then(closeModal);
}

/* =========================================================================
   RENDER: driving mode
   ========================================================================= */
function renderDrivingMode(){
  const trip = getCurrentTrip();
  if (!trip) return;
  const stops = trip.stops || [];
  const container = document.getElementById('driving-mode-container');

  if (stops.length === 0){
    container.innerHTML = `<div class="card">Add stops to this trip before starting driving mode.</div>`;
    return;
  }
  if (currentStopIndex >= stops.length){
    container.innerHTML = `<div class="card" style="text-align:center;">🏁 All stops complete. Trip finished!</div>`;
    return;
  }

  const stop = stops[currentStopIndex];
  const seatsAtStop = (stop.passengers||[]).reduce((a,p)=>a+Number(p.seats||0),0);
  const overbooked = seatsAtStop > Number(trip.carCapacity||4);

  const passengerRows = (stop.passengers||[]).map(p => `
    <div class="passenger-row">
      <div>
        <div style="font-size:14px; font-weight:500;">${escapeHtml(p.name)} <span style="color:var(--muted); font-weight:400; font-size:12px;">· ${p.seats} seat${p.seats==1?'':'s'}</span></div>
        <span class="badge ${p.paid?'paid':'unpaid'}">${p.paid?'Paid':'Unpaid'}</span>
      </div>
      <div class="actions">
        ${p.phone ? `<a class="icon-btn" href="tel:${escapeAttr(p.phone)}"><button aria-label="Call ${escapeAttr(p.name)}">Call</button></a>` : ''}
        ${p.phone ? `<a class="icon-btn" href="https://wa.me/${escapeAttr(p.phone.replace(/[^0-9]/g,''))}" target="_blank"><button aria-label="WhatsApp ${escapeAttr(p.name)}">WA</button></a>` : ''}
        <button onclick="togglePickedUp(${currentStopIndex}, '${p.id}')">${p.pickedUp ? '✓ Picked up' : 'Mark picked up'}</button>
      </div>
    </div>
  `).join('');

  const upcoming = stops.slice(currentStopIndex+1).map((s, i) => {
    const seats = (s.passengers||[]).reduce((a,p)=>a+Number(p.seats||0),0);
    const over = seats > Number(trip.carCapacity||4);
    return `
      <div class="upcoming-item ${over?'overbooked':''}">
        <div>
          <div style="font-size:14px; font-weight:500;">${escapeHtml(s.name)} <span style="color:var(--muted); font-weight:400; font-size:12px;">· ETA ${s.etaTime||'—'}</span></div>
          ${over ? `<div style="font-size:12px; color:var(--danger); margin-top:2px;">⚠ ${seats} seats booked, car holds ${trip.carCapacity}</div>`
                 : `<div style="font-size:12px; color:var(--muted); margin-top:2px;">${(s.passengers||[]).length} passenger${(s.passengers||[]).length==1?'':'s'}</div>`}
        </div>
      </div>
    `;
  }).join('');

  container.innerHTML = `
    <div class="next-stop-card">
      <div class="eyebrow">NEXT STOP${overbooked ? ' · OVERBOOKED' : ''}</div>
      <div class="name">${escapeHtml(stop.name)}</div>
      <div class="meta">${escapeHtml(stop.location||'')} · ETA ${stop.etaTime||'—'}</div>
      ${navButtonsHtml(stop.lat, stop.lng)}
      ${overbooked ? `<div class="warn-banner" style="margin-bottom:10px;">⚠ ${seatsAtStop} of ${trip.carCapacity} seats booked here</div>` : ''}
      ${passengerRows}
      <button class="primary" style="width:100%; margin-top:14px;" onclick="advanceStop()">Arrived at ${escapeHtml(stop.name)}</button>
    </div>
    ${upcoming ? `<div style="font-size:12px; color:var(--muted); margin-bottom:8px;">UPCOMING STOPS</div>${upcoming}` : ''}
  `;
}

function togglePickedUp(stopIdx, paxId){
  const trip = getCurrentTrip();
  const stops = [...trip.stops];
  const stop = { ...stops[stopIdx], passengers: stops[stopIdx].passengers.map(p =>
    p.id === paxId ? { ...p, pickedUp: !p.pickedUp } : p
  )};
  stops[stopIdx] = stop;
  saveTrip({ ...trip, stops });
}

function advanceStop(){
  currentStopIndex += 1;
  renderDrivingMode();
}

/* =========================================================================
   MODAL HELPERS
   ========================================================================= */
function renderModal(innerHtml){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">${innerHtml}</div>
    </div>
  `;
}
function closeModal(){
  document.getElementById('modal-root').innerHTML = '';
}

/* =========================================================================
   UTIL
   ========================================================================= */
function navButtonsHtml(lat, lng){
  const links = mapsLinks(lat, lng);
  if (!links) return `<div style="font-size:12px; color:var(--muted); margin-bottom:6px;">No coordinates saved for this stop yet — add lat/lng when editing to enable navigation buttons.</div>`;
  return `
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <a class="icon-btn" style="flex:1;" href="${links.google}" target="_blank"><button style="width:100%;">📍 Google Maps</button></a>
      <a class="icon-btn" style="flex:1;" href="${links.apple}" target="_blank"><button style="width:100%;">🧭 Apple Maps</button></a>
    </div>
  `;
}

function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }
</script>
</body>
</html>
